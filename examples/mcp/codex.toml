# Codex：把下面这段追加到 ~/.codex/config.toml，然后重启 Codex。
#
# 注意：env 必须给 PYTHONPATH —— 解释器里没有 a2a_hub 这个包（它是本仓库源码，在 src/ 下），
# 缺了会启动失败，而 Codex 不会报「服务器起不来」，只会让你看不到工具。

[mcp_servers.a2a-hub]
command = '<PYTHON>'
args = ["-m", "a2a_hub.mcp_facade"]
cwd = '<A2A_HUB_DIR>'
startup_timeout_sec = 60

[mcp_servers.a2a-hub.env]
PYTHONPATH = '<A2A_HUB_DIR>/src'
HUB_URL = 'http://127.0.0.1:9200'
# hub 启用 Bearer 认证时再加：
# HUB_TOKEN = '<your-token>'
